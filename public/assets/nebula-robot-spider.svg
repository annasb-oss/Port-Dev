d">12</text><text x="126" y="432" fill="#d49cff" font-size="15">}</text><text x="103" y="456" fill="#74657f" font-size="13" text-anchor="end">13</text><text x="126" y="456" fill="#f18bdc" font-size="15">@Service</text><text x="103" y="480" fill="#74657f" font-size="13" text-anchor="end">14</text><text x="126" y="480" fill="#d49cff" font-size="15">public class MetadataExtractor {</text><text x="103" y="504" fill="#74657f" font-size="13" text-anchor="end">15</text><text x="126" y="504" fill="#c9bdd2" font-size="15">  public Metadata parse(Document html) {</text><text x="103" y="528" fill="#74657f" font-size="13" text-anchor="end">16</text><text x="126" y="528" fill="#c9bdd2" font-size="15">    String title = html.title();</text><text x="103" y="552" fill="#74657f" font-size="13" text-anchor="end">17</text><text x="126" y="552" fill="#c9bdd2" font-size="15">    String description = html.select(&quot;meta&quot;);</text><text x="103" y="576" fill="#74657f" font-size="13" text-anchor="end">18</text><text x="126" y="576" fill="#f18bdc" font-size="15">    return new Metadata(title, description);</text><text x="103" y="600" fill="#74657f" font-size="13" text-anchor="end">19</text><text x="126" y="600" fill="#c9bdd2" font-size="15">  }</text><text x="103" y="624" fill="#74657f" font-size="13" text-anchor="end">20</text><text x="126" y="624" fill="#d49cff" font-size="15">}</text><text x="103" y="648" fill="#74657f" font-size="13" text-anchor="end">21</text><text x="126" y="648" fill="#f18bdc" font-size="15">@Transactional</text><text x="103" y="672" fill="#74657f" font-size="13" text-anchor="end">22</text><text x="126" y="672" fill="#d49cff" font-size="15">public void savePage(CrawlPage page) {</text><text x="103" y="696" fill="#74657f" font-size="13" text-anchor="end">23</text><text x="126" y="696" fill="#c9bdd2" font-size="15">  repository.save(page);</text><text x="103" y="720" fill="#74657f" font-size="13" text-anchor="end">24</text><text x="126" y="720" fill="#f18bdc" font-size="15">  log.info(&quot;Indexed: {}&quot;, page.url());</text><text x="103" y="744" fill="#74657f" font-size="13" text-anchor="end">25</text><text x="126" y="744" fill="#c9bdd2" font-size="15">}</text></g>
   <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -600" dur="14s" repeatCount="indefinite"/>
