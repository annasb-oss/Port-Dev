 <g font-family="monospace">
  <g opacity=".20"><path d="M110 150H725M110 690H725" stroke="#9d55b7" stroke-dasharray="3 9"/></g>
  <g><text x="72" y="175" fill="#d89cff" font-size="17">public class NebulaCrawler {</text>
<text x="72" y="202" fill="#b8a9c9" font-size="17">  private final WebClient client;</text>
<text x="72" y="229" fill="#d89cff" font-size="17">  public CrawlResult scan(String url) {</text>
<text x="72" y="256" fill="#b8a9c9" font-size="17">    URI target = URI.create(url);</text>
<text x="72" y="283" fill="#b8a9c9" font-size="17">    RobotsPolicy policy = robots.load(target);</text>
<text x="72" y="310" fill="#e9a7f4" font-size="17">    if (!policy.isAllowed(target)) return SKIPPED;</text>
<text x="72" y="337" fill="#b8a9c9" font-size="17">    Document page = client.get(target);</text>
<text x="72" y="364" fill="#b8a9c9" font-size="17">    Set&lt;URI&gt; links = extractLinks(page);</text>
<text x="72" y="391" fill="#b8a9c9" font-size="17">    links.forEach(queue::offer);</text>
<text x="72" y="418" fill="#e9a7f4" font-size="17">    return indexer.store(page);</text>
<text x="72" y="445" fill="#b8a9c9" font-size="17">  }</text>
<text x="72" y="472" fill="#b8a9c9" font-size="17">}</text>
<text x="72" y="499" fill="#d89cff" font-size="17">@Service</text>
<text x="72" y="526" fill="#d89cff" font-size="17">public class MetadataExtractor {</text>
<text x="72" y="553" fill="#d89cff" font-size="17">  public Metadata parse(Document html) {</text>
<text x="72" y="580" fill="#b8a9c9" font-size="17">    String title = html.title();</text>
<text x="72" y="607" fill="#b8a9c9" font-size="17">    String description = html.select("meta");</text>
<text x="72" y="634" fill="#e9a7f4" font-size="17">    return new Metadata(title, description);</text>
<text x="72" y="661" fill="#b8a9c9" font-size="17">}</text>
<text x="72" y="688" fill="#d89cff" font-size="17">@Transactional</text>
<text x="72" y="715" fill="#d89cff" font-size="17">public void savePage(CrawlPage page) {</text>
<text x="72" y="742" fill="#b8a9c9" font-size="17">  repository.save(page);</text>
<text x="72" y="769" fill="#b8a9c9" font-size="17">  log.info("Indexed: {}", page.url());</text>
<text x="72" y="796" fill="#b8a9c9" font-size="17">}</text>
<text x="72" y="823" fill="#d89cff" font-size="17">public boolean isAllowed(URI uri) {</text>
<text x="72" y="850" fill="#e9a7f4" font-size="17">  return robotsRules.matches(uri);</text>
<text x="72" y="877" fill="#b8a9c9" font-size="17">}</text>
</g>
  <g opacity=".40" transform="translate(0 650)"><text x="72" y="175" fill="#d89cff" font-size="17">public class NebulaCrawler {</text>
<text x="72" y="202" fill="#b8a9c9" font-size="17">  private final WebClient client;</text>
<text x="72" y="229" fill="#d89cff" font-size="17">  public CrawlResult scan(String url) {</text>
<text x="72" y="256" fill="#b8a9c9" font-size="17">    URI target = URI.create(url);</text>
<text x="72" y="283" fill="#b8a9c9" font-size="17">    RobotsPolicy policy = robots.load(target);</text>
<text x="72" y="310" fill="#e9a7f4" font-size="17">    if (!policy.isAllowed(target)) return SKIPPED;</text>
<text x="72" y="337" fill="#b8a9c9" font-size="17">    Document page = client.get(target);</text>
<text x="72" y="364" fill="#b8a9c9" font-size="17">    Set&lt;URI&gt; links = extractLinks(page);</text>
<text x="72" y="391" fill="#b8a9c9" font-size="17">    links.forEach(queue::offer);</text>
<text x="72" y="418" fill="#e9a7f4" font-size="17">    return indexer.store(page);</text>
<text x="72" y="445" fill="#b8a9c9" font-size="17">  }</text>
<text x="72" y="472" fill="#b8a9c9" font-size="17">}</text>
<text x="72" y="499" fill="#d89cff" font-size="17">@Service</text>
<text x="72" y="526" fill="#d89cff" font-size="17">public class MetadataExtractor {</text>
<text x="72" y="553" fill="#d89cff" font-size="17">  public Metadata parse(Document html) {</text>
<text x="72" y="580" fill="#b8a9c9" font-size="17">    String title = html.title();</text>
<text x="72" y="607" fill="#b8a9c9" font-size="17">    String description = html.select("meta");</text>
<text x="72" y="634" fill="#e9a7f4" font-size="17">    return new Metadata(title, description);</text>
<text x="72" y="661" fill="#b8a9c9" font-size="17">}</text>
<text x="72" y="688" fill="#d89cff" font-size="17">@Transactional</text>
<text x="72" y="715" fill="#d89cff" font-size="17">public void savePage(CrawlPage page) {</text>
<text x="72" y="742" fill="#b8a9c9" font-size="17">  repository.save(page);</text>
<text x="72" y="769" fill="#b8a9c9" font-size="17">  log.info("Indexed: {}", page.url());</text>
<text x="72" y="796" fill="#b8a9c9" font-size="17">}</text>
<text x="72" y="823" fill="#d89cff" font-size="17">public boolean isAllowed(URI uri) {</text>
<text x="72" y="850" fill="#e9a7f4" font-size="17">  return robotsRules.matches(uri);</text>
<text x="72" y="877" fill="#b8a9c9" font-size="17">}</text>
</g>
 </g>
