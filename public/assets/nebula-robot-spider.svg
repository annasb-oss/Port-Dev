<rect x="160" y="49" width="480" height="30" rx="15" fill="#100d17" stroke="#4b3854"/>
<text x="184" y="69" fill="#bcaec4" font-family="Arial,sans-serif" font-size="13">google.com/search</text>
<!-- Google-like search header -->
<g font-family="Arial,sans-serif"><text x="75" y="145" font-size="43" font-weight="600"><tspan fill="#4285F4">G</tspan><tspan fill="#EA4335">o</tspan><tspan fill="#FBBC05">o</tspan><tspan fill="#4285F4">g</tspan><tspan fill="#34A853">l</tspan><tspan fill="#EA4335">e</tspan></text>
<rect x="260" y="112" width="460" height="48" rx="24" fill="#17131e" stroke="#62446d"/>
<circle cx="286" cy="136" r="8" fill="none" stroke="#b8a7c1" stroke-width="2"/><path d="M292 142l7 7" stroke="#b8a7c1" stroke-width="2"/>
<text x="312" y="141" fill="#f4eefa" font-size="15">pesquisa web crawler Java</text>
<text x="76" y="190" fill="#9c8ca6" font-size="12">Todas as pesquisas</text><path d="M75 200H724" stroke="#392b42"/></g>
<!-- Search results -->
<g font-family="Arial,sans-serif">
<g id="q1"><rect x="75" y="220" width="650" height="49" rx="10" fill="url(#panel)" stroke="#58355f"/><text x="94" y="240" fill="#d8b5ec" font-size="10">GOOGLE SEARCH · 01</text><text x="94" y="258" fill="#fff" font-size="15">Java Spring Boot web crawler tutorial</text><circle cx="698" cy="244" r="5" fill="#b64be1"/></g>
<g id="q2"><rect x="75" y="282" width="650" height="49" rx="10" fill="url(#panel)" stroke="#58355f"/><text x="94" y="302" fill="#d8b5ec" font-size="10">GOOGLE SEARCH · 02</text><text x="94" y="320" fill="#fff" font-size="15">Como funciona o arquivo robots.txt?</text><circle cx="698" cy="306" r="5" fill="#b64be1"/></g>
<g id="q3"><rect x="75" y="344" width="650" height="49" rx="10" fill="url(#panel)" stroke="#58355f"/><text x="94" y="364" fill="#d8b5ec" font-size="10">GOOGLE SEARCH · 03</text><text x="94" y="382" fill="#fff" font-size="15">Extrair metadados HTML com Java</text><circle cx="698" cy="368" r="5" fill="#b64be1"/></g>
<g id="q4"><rect x="75" y="406" width="650" height="49" rx="10" fill="url(#panel)" stroke="#58355f"/><text x="94" y="426" fill="#d8b5ec" font-size="10">GOOGLE SEARCH · 04</text><text x="94" y="444" fill="#fff" font-size="15">Encontrar links internos e externos de páginas</text><circle cx="698" cy="430" r="5" fill="#b64be1"/></g>
<g id="q5"><rect x="75" y="468" width="650" height="49" rx="10" fill="url(#panel)" stroke="#58355f"/><text x="94" y="488" fill="#d8b5ec" font-size="10">GOOGLE SEARCH · 05</text><text x="94" y="506" fill="#fff" font-size="15">Indexação de páginas públicas na web</text><circle cx="698" cy="492" r="5" fill="#b64be1"/></g>
<g id="q6"><rect x="75" y="530" width="650" height="49" rx="10" fill="url(#panel)" stroke="#58355f"/><text x="94" y="550" fill="#d8b5ec" font-size="10">GOOGLE SEARCH · 06</text><text x="94" y="568" fill="#fff" font-size="15">Crawler com limite de requisições por domínio</text><circle cx="698" cy="554" r="5" fill="#b64be1"/></g>
<g id="q7"><rect x="75" y="592" width="650" height="49" rx="10" fill="url(#panel)" stroke="#58355f"/><text x="94" y="612" fill="#d8b5ec" font-size="10">GOOGLE SEARCH · 07</text><text x="94" y="630" fill="#fff" font-size="15">Como rastrear sitemap.xml automaticamente</text><circle cx="698" cy="616" r="5" fill="#b64be1"/></g>
<g id="q8"><rect x="75" y="654" width="650" height="49" rx="10" fill="url(#panel)" stroke="#58355f"/><text x="94" y="674" fill="#d8b5ec" font-size="10">GOOGLE SEARCH · 08</text><text x="94" y="692" fill="#fff" font-size="15">Web scraping responsável e boas práticas</text><circle cx="698" cy="678" r="5" fill="#b64be1"/></g>
</g>
