<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Nebula Search — aranha roxa caminhando sobre código Java</title>
<desc id="desc">Aranha neon roxa caminha de um lado ao outro na parte superior de um editor com várias linhas de código Java de um web crawler.</desc>
