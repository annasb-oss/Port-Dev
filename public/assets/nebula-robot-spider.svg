  <g>
   <g transform="translate(0 0)"><text x="103" y="168" fill="#74657f" font-size="13" text-anchor="end">01</text><text x="126" y="168" fill="#d49cff" font-size="15">public class NebulaCrawler {</text><text x="103" y="192" fill="#74657f" font-size="13" text-anchor="end">02</text><text x="126" y="192" fill="#c9bdd2" font-size="15">  private final WebClient client;</text><text x="103" y="216" fill="#74657f" font-size="13" text-anchor="end">03</text><text x="126" y="216" fill="#d49cff" font-size="15">  public CrawlResult scan(String url) {</text><text x="103" y="240" fill="#74657f" font-size="13" text-anchor="end">04</text><text x="126" y="240" fill="#c9bdd2" font-size="15">    URI target = URI.create(url);</text><text x="103" y="264" fill="#74657f" font-size="13" text-anchor="end">05</text><text x="126" y="264" fill="#c9bdd2" font-size="15">    RobotsPolicy policy = robots.load(target);</text><text x="103" y="288" fill="#74657f" font-size="13" text-anchor="end">06</text><text x="126" y="288" fill="#f18bdc" font-size="15">    if (!policy.isAllowed(target)) return SKIPPED;</text><text x="103" y="312" fill="#74657f" font-size="13" text-anchor="end">07</text><text x="126" y="312" fill="#c9bdd2" font-size="15">    Document page = client.get(target);</text><text x="103" y="336" fill="#74657f" font-size="13" text-anchor="end">08</text><text x="126" y="336" fill="#c9bdd2" font-size="15">    Set&lt;URI&gt; links = extractLinks(page);</text><text x="103" y="360" fill="#74657f" font-size="13" text-anchor="end">09</text><text x="126" y="360" fill="#c9bdd2" font-size="15">    links.forEach(queue::offer);</text><text x="103" y="384" fill="#74657f" font-size="13" text-anchor="end">10</text><text x="126" y="384" fill="#f18bdc" font-size="15">    return indexer.store(page);</text><text x="103" y="408" fill="#74657f" font-size="13" text-anchor="end">11</text><text x="126" y="408" fill="#c9bdd2" font-size="15">  }</text><text x="103" y="432" fill="#74657f" font-size="13" text-anchor="end">12</text><text x="126" y="432" fill="#d49cff" font-size="15">}</text><text x="103" y="456" fill="#74657f" font-size="13" text-anchor="end">13</text><text x="126" y="456" fill="#f18bdc" font-size="15">@Service</text><text x="103" y="480" fill="#74657f" font-size="13" text-anchor="end">14</text><text x="126" y="480" fill="#d49cff" font-size="15">public class MetadataExtractor {</text><text x="103" y="504" fill="#74657f" font-size="13" text-anchor="end">15</text><text x="126" y="504" fill="#c9bdd2" font-size="15">  public Metadata parse(Document html) {</text><text x="103" y="528" fill="#74657f" font-size="13" text-anchor="end">16</text><text x="126" y="528" fill="#c9bdd2" font-size="15">    String title = html.title();</text><text x="103" y="552" fill="#74657f" font-size="13" text-anchor="end">17</text><text x="126" y="552" fill="#c9bdd2" font-size="15">    String description = html.select(&quot;meta&quot;);</text><text x="103" y="576" fill="#74657f" font-size="13" text-anchor="end">18</text><text x="126" y="576" fill="#f18bdc" font-size="15">    return new Metadata(title, description);</text><text x="103" y="600" fill="#74657f" font-size="13" text-anchor="end">19</text><text x="126" y="600" fill="#c9bdd2" font-size="15">  }</text><text x="103" y="624" fill="#74657f" font-size="13" text-anchor="end">20</text><text x="126" y="624" fill="#d49cff" font-size="15">}</text><text x="103" y="648" fill="#74657f" font-size="13" text-anchor="end">21</text><text x="126" y="648" fill="#f18bdc" font-size="15">@Transactional</text><text x="103" y="672" fill="#74657f" font-size="13" text-anchor="end">22</text><text x="126" y="672" fill="#d49cff" font-size="15">public void savePage(CrawlPage page) {</text><text x="103" y="696" fill="#74657f" font-size="13" text-anchor="end">23</text><text x="126" y="696" fill="#c9bdd2" font-size="15">  repository.save(page);</text><text x="103" y="720" fill="#74657f" font-size="13" text-anchor="end">24</text><text x="126" y="720" fill="#f18bdc" font-size="15">  log.info(&quot;Indexed: {}&quot;, page.url());</text><text x="103" y="744" fill="#74657f" font-size="13" text-anchor="end">25</text><text x="126" y="744" fill="#c9bdd2" font-size="15">}</text></g>
