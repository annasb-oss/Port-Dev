<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Nebula Search — aranha pesquisando no Google</title>
<desc id="desc">Aranha neon roxa percorre uma interface de pesquisas Google, realizando várias buscas sobre rastreamento e indexação de páginas.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#090611"/><stop offset="1" stop-color="#16091d"/></linearGradient>
 <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1b1424"/><stop offset="1" stop-color="#100d18"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
 <linearGradient id="spider" x2="1" y2="1"><stop stop-color="#ff9af1"/><stop offset=".48" stop-color="#e34bd4"/><stop offset="1" stop-color="#8f35c8"/></linearGradient>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<circle cx="400" cy="395" r="250" fill="#a52dba" opacity=".13" filter="url(#soft)"/>
