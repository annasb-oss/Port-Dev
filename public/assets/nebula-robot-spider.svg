<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Nebula Search — aranha caminhando sobre números e código Java</title>
<desc id="desc">Código Java sobe continuamente em um editor. Uma aranha neon roxa caminha verticalmente por cima dos números das linhas, destacando o código em rosa.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#080610"/><stop offset="1" stop-color="#13091c"/></linearGradient>
 <linearGradient id="spider" x2="1" y2="1"><stop stop-color="#ffb4f5"/><stop offset=".45" stop-color="#e84bd9"/><stop offset="1" stop-color="#9235c8"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="screen"><rect x="36" y="40" width="728" height="720" rx="20"/></clipPath>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<rect x="36" y="40" width="728" height="720" rx="20" fill="#0b0a12" stroke="#50365e" stroke-width="2"/>
<path d="M56 40H744a20 20 0 0 1 20 20v43H36V60a20 20 0 0 1 20-20Z" fill="#211729"/>
<circle cx="66" cy="69" r="6" fill="#ff718e"/><circle cx="89" cy="69" r="6" fill="#ffd16d"/><circle cx="112" cy="69" r="6" fill="#8be5a2"/>
<text x="145" y="75" fill="#c7b4d1" font-family="Arial,sans-serif" font-size="14">NEBULA SEARCH / NebulaCrawler.java</text>
