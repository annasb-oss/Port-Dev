  <path d="M576 228 Q508 230 450 365" stroke="#ff8be8" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;68" dur="2.2s" repeatCount="indefinite"/></path>
  <path d="M224 365 Q290 365 333 390" stroke="#ff4bd8" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;-68" dur="1.9s" repeatCount="indefinite"/></path>
  <path d="M576 365 Q510 365 467 390" stroke="#ff8be8" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;68" dur="2.3s" repeatCount="indefinite"/></path>
  <path d="M224 502 Q292 490 350 430" stroke="#ff4bd8" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;-68" dur="2s" repeatCount="indefinite"/></path>
  <path d="M576 502 Q508 490 450 430" stroke="#ff8be8" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;68" dur="2.4s" repeatCount="indefinite"/></path>
  <path d="M224 639 Q300 590 365 465" stroke="#ff4bd8" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;-68" dur="2.2s" repeatCount="indefinite"/></path>
  <path d="M576 639 Q500 590 435 465" stroke="#ff8be8" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;68" dur="2.5s" repeatCount="indefinite"/></path>
</g>
<g fill="#ffd5f6" filter="url(#glow)">
  <circle r="4.5"><animateMotion dur="2.2s" repeatCount="indefinite" path="M224 91 Q300 110 365 335"/></circle>
  <circle r="4.5"><animateMotion dur="2.5s" repeatCount="indefinite" path="M576 639 Q500 590 435 465"/></circle>
  <circle r="4"><animateMotion dur="2.1s" repeatCount="indefinite" path="M224 365 Q290 365 333 390"/></circle>
  <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M576 228 Q508 230 450 365"/></circle>
</g>
<g id="nebula-crawler" filter="url(#glow)">
<animateMotion dur="16s" repeatCount="indefinite" rotate="auto" path="M0 0 C-24 -20 -34 -5 -20 16 C-4 30 20 18 26 -2 C32 -22 12 -32 0 0"/>
