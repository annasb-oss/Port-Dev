<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Nebula Search — aranha robótica rastreadora</title>
<desc id="desc">Aranha robótica de oito pernas articuladas em azul-ciano, rastreando quatro URLs conectadas em uma interface futurista.</desc>
<defs>
  <radialGradient id="background"><stop stop-color="#10285d"/><stop offset=".58" stop-color="#080e25"/><stop offset="1" stop-color="#030611"/></radialGradient>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8fbff"/><stop offset=".28" stop-color="#4c91bd"/><stop offset=".7" stop-color="#193967"/><stop offset="1" stop-color="#0b1735"/></linearGradient>
  <linearGradient id="cyan"><stop stop-color="#3af4ff"/><stop offset=".55" stop-color="#58aaff"/><stop offset="1" stop-color="#bd72ff"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3b76c9" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="800" height="800" fill="url(#background)"/>
<rect width="800" height="800" fill="url(#grid)"/>
<circle cx="400" cy="390" r="210" fill="#168dff" opacity=".13" filter="url(#softGlow)"/>
<g fill="none" stroke="#3266bd" stroke-opacity=".3"><circle cx="400" cy="390" r="210"/><circle cx="400" cy="390" r="270" stroke-dasharray="5 13"/><circle cx="400" cy="390" r="330" stroke-dasharray="2 16"/></g>
<!-- URL nodes -->
<g font-family="Arial,sans-serif" font-size="18" font-weight="700">
  <g><rect x="35" y="170" width="205" height="58" rx="13" fill="#0b1d48" stroke="#37eaff" stroke-width="2.5"/><text x="56" y="206" fill="#e0fbff">https://site.dev</text><circle cx="48" cy="181" r="4" fill="#6ff8ff"/></g>
  <g><rect x="560" y="170" width="205" height="58" rx="13" fill="#17123f" stroke="#a66cff" stroke-width="2.5"/><text x="581" y="206" fill="#f2eaff">https://page.io</text><circle cx="573" cy="181" r="4" fill="#d4a0ff"/></g>
  <g><rect x="35" y="570" width="205" height="58" rx="13" fill="#0b1d48" stroke="#35e8dc" stroke-width="2.5"/><text x="56" y="606" fill="#e0ffff">https://docs.app</text><circle cx="48" cy="581" r="4" fill="#75fff1"/></g>
  <g><rect x="560" y="570" width="205" height="58" rx="13" fill="#17123f" stroke="#d15cff" stroke-width="2.5"/><text x="581" y="606" fill="#fff0ff">https://web.net</text><circle cx="573" cy="581" r="4" fill="#f4a0ff"/></g>
</g>
<!-- Data paths -->
<g fill="none" stroke-width="3" stroke-linecap="round">
  <path d="M240 200 Q315 220 355 320" stroke="#38eaff" stroke-dasharray="8 11"><animate attributeName="stroke-dashoffset" values="0;-76" dur="2s" repeatCount="indefinite"/></path>
  <path d="M560 200 Q485 220 445 320" stroke="#a66cff" stroke-dasharray="8 11"><animate attributeName="stroke-dashoffset" values="0;76" dur="2.3s" repeatCount="indefinite"/></path>
  <path d="M240 600 Q315 560 355 465" stroke="#35e8dc" stroke-dasharray="8 11"><animate attributeName="stroke-dashoffset" values="0;-76" dur="2.1s" repeatCount="indefinite"/></path>
  <path d="M560 600 Q485 560 445 465" stroke="#d15cff" stroke-dasharray="8 11"><animate attributeName="stroke-dashoffset" values="0;76" dur="2.4s" repeatCount="indefinite"/></path>
</g>
<g fill="#bafaff" filter="url(#glow)"><circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M240 200 Q315 220 355 320"/></circle><circle r="5"><animateMotion dur="2.7s" repeatCount="indefinite" path="M560 600 Q485 560 445 465"/></circle></g>
<!-- Eight independently articulated mechanical legs -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <g transform="translate(365 365)"><animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="1.25s" repeatCount="indefinite"/><path d="M0 0L-34 -28L-68 -23L-100 -58L-126 -65" stroke="#9adfff" stroke-width="12"/><path d="M-68 -23L-100 -58" stroke="#e2fbff" stroke-width="3"/><circle cx="-34" cy="-28" r="8" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="-68" cy="-23" r="7" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="-126" cy="-65" r="5" fill="#55efff"/></g>
  <g transform="translate(355 385)"><animateTransform attributeName="transform" type="rotate" values="4 0 0;-5 0 0;4 0 0" dur="1.4s" repeatCount="indefinite"/><path d="M0 0L-43 -10L-82 8L-116 -5L-143 4" stroke="#83d7f7" stroke-width="12"/><circle cx="-43" cy="-10" r="8" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="-82" cy="8" r="7" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="-143" cy="4" r="5" fill="#55efff"/></g>
  <g transform="translate(365 415)"><animateTransform attributeName="transform" type="rotate" values="-4 0 0;5 0 0;-4 0 0" dur="1.35s" repeatCount="indefinite"/><path d="M0 0L-38 24L-72 50L-105 48L-128 75" stroke="#9adfff" stroke-width="12"/><circle cx="-38" cy="24" r="8" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="-72" cy="50" r="7" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="-128" cy="75" r="5" fill="#55efff"/></g>
  <g transform="translate(385 435)"><animateTransform attributeName="transform" type="rotate" values="5 0 0;-4 0 0;5 0 0" dur="1.5s" repeatCount="indefinite"/><path d="M0 0L-18 38L-36 75L-61 91L-72 121" stroke="#83d7f7" stroke-width="12"/><circle cx="-18" cy="38" r="8" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="-36" cy="75" r="7" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="-72" cy="121" r="5" fill="#55efff"/></g>
  <g transform="translate(435 365)"><animateTransform attributeName="transform" type="rotate" values="5 0 0;-5 0 0;5 0 0" dur="1.3s" repeatCount="indefinite"/><path d="M0 0L34 -28L68 -23L100 -58L126 -65" stroke="#9adfff" stroke-width="12"/><path d="M68 -23L100 -58" stroke="#e2fbff" stroke-width="3"/><circle cx="34" cy="-28" r="8" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="68" cy="-23" r="7" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="126" cy="-65" r="5" fill="#55efff"/></g>
  <g transform="translate(445 385)"><animateTransform attributeName="transform" type="rotate" values="-4 0 0;5 0 0;-4 0 0" dur="1.45s" repeatCount="indefinite"/><path d="M0 0L43 -10L82 8L116 -5L143 4" stroke="#83d7f7" stroke-width="12"/><circle cx="43" cy="-10" r="8" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="82" cy="8" r="7" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="143" cy="4" r="5" fill="#55efff"/></g>
  <g transform="translate(435 415)"><animateTransform attributeName="transform" type="rotate" values="4 0 0;-5 0 0;4 0 0" dur="1.38s" repeatCount="indefinite"/><path d="M0 0L38 24L72 50L105 48L128 75" stroke="#9adfff" stroke-width="12"/><circle cx="38" cy="24" r="8" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="72" cy="50" r="7" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="128" cy="75" r="5" fill="#55efff"/></g>
  <g transform="translate(415 435)"><animateTransform attributeName="transform" type="rotate" values="-5 0 0;4 0 0;-5 0 0" dur="1.52s" repeatCount="indefinite"/><path d="M0 0L18 38L36 75L61 91L72 121" stroke="#83d7f7" stroke-width="12"/><circle cx="18" cy="38" r="8" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="36" cy="75" r="7" fill="#163c6d" stroke="#54edff" stroke-width="4"/><circle cx="72" cy="121" r="5" fill="#55efff"/></g>
</g>
<!-- Mechanical body -->
<g filter="url(#glow)">
  <ellipse cx="400" cy="400" rx="67" ry="82" fill="#06142e" stroke="#4deaff" stroke-width="4"/>
  <path d="M400 316L458 350L470 410L438 470L362 470L330 410L342 350Z" fill="url(#shell)" stroke="#d8fbff" stroke-width="4"/>
  <path d="M400 330L444 356L450 408L425 452L375 452L350 408L356 356Z" fill="#10264d" stroke="url(#cyan)" stroke-width="5"/>
  <rect x="370" y="369" width="60" height="55" rx="17" fill="#071a37" stroke="#9defff" stroke-width="3"/>
  <circle cx="400" cy="396" r="19" fill="#46eaff" stroke="#e1ffff" stroke-width="5"><animate attributeName="r" values="16;21;16" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="396" r="7" fill="#09203b"/>
  <path d="M382 441H418M389 454H411" stroke="#d4fbff" stroke-width="5" stroke-linecap="round"/>
  <path d="M400 316V286" stroke="#59eaff" stroke-width="4"/><circle cx="400" cy="279" r="7" fill="#59eaff"><animate attributeName="r" values="5;10;5" dur="1s" repeatCount="indefinite"/></circle>
</g>
<g fill="#c5faff" opacity=".8"><circle cx="280" cy="280" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="520" cy="285" r="4"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle><circle cx="300" cy="520" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="500" cy="520" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/></circle></g>
</svg>