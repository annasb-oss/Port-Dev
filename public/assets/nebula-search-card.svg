  <g transform="translate(365 415)"><animateTransform attributeName="transform" type="rotate" values="-4 0 0;5 0 0;-4 0 0" dur="1.35s" additive="sum" repeatCount="indefinite"/><path d="M0 0L-38 24L-72 50L-105 48L-128 75" stroke="#ff8be8" stroke-width="12"/><circle cx="-38" cy="24" r="8" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="-72" cy="50" r="7" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="-128" cy="75" r="5" fill="#ff4bd8"/></g>
  <g transform="translate(385 435)"><animateTransform attributeName="transform" type="rotate" values="5 0 0;-4 0 0;5 0 0" dur="1.5s" additive="sum" repeatCount="indefinite"/><path d="M0 0L-18 38L-36 75L-61 91L-72 121" stroke="#ff65cf" stroke-width="12"/><circle cx="-18" cy="38" r="8" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="-36" cy="75" r="7" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="-72" cy="121" r="5" fill="#ff4bd8"/></g>
  <g transform="translate(435 365)"><animateTransform attributeName="transform" type="rotate" values="5 0 0;-5 0 0;5 0 0" dur="1.3s" additive="sum" repeatCount="indefinite"/><path d="M0 0L34 -28L68 -23L100 -58L126 -65" stroke="#ff8be8" stroke-width="12"/><path d="M68 -23L100 -58" stroke="#ffe5fb" stroke-width="3"/><circle cx="34" cy="-28" r="8" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="68" cy="-23" r="7" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="126" cy="-65" r="5" fill="#ff4bd8"/></g>
  <g transform="translate(445 385)"><animateTransform attributeName="transform" type="rotate" values="-4 0 0;5 0 0;-4 0 0" dur="1.45s" additive="sum" repeatCount="indefinite"/><path d="M0 0L43 -10L82 8L116 -5L143 4" stroke="#ff65cf" stroke-width="12"/><circle cx="43" cy="-10" r="8" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="82" cy="8" r="7" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="143" cy="4" r="5" fill="#ff4bd8"/></g>
  <g transform="translate(435 415)"><animateTransform attributeName="transform" type="rotate" values="4 0 0;-5 0 0;4 0 0" dur="1.38s" additive="sum" repeatCount="indefinite"/><path d="M0 0L38 24L72 50L105 48L128 75" stroke="#ff8be8" stroke-width="12"/><circle cx="38" cy="24" r="8" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="72" cy="50" r="7" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="128" cy="75" r="5" fill="#ff4bd8"/></g>
  <g transform="translate(415 435)"><animateTransform attributeName="transform" type="rotate" values="-5 0 0;4 0 0;-5 0 0" dur="1.52s" additive="sum" repeatCount="indefinite"/><path d="M0 0L18 38L36 75L61 91L72 121" stroke="#ff65cf" stroke-width="12"/><circle cx="18" cy="38" r="8" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="36" cy="75" r="7" fill="#571044" stroke="#ff8be8" stroke-width="4"/><circle cx="72" cy="121" r="5" fill="#ff4bd8"/></g>
</g>
<!-- Mechanical body -->
<g filter="url(#glow)">
  <ellipse cx="400" cy="400" rx="67" ry="82" fill="#06142e" stroke="#4deaff" stroke-width="4"/>
  <path d="M400 316L458 350L470 410L438 470L362 470L330 410L342 350Z" fill="url(#shell)" stroke="#ffe2fa" stroke-width="4"/>
  <path d="M400 330L444 356L450 408L425 452L375 452L350 408L356 356Z" fill="#10264d" stroke="url(#cyan)" stroke-width="5"/>
  <rect x="370" y="369" width="60" height="55" rx="17" fill="#071a37" stroke="#9defff" stroke-width="3"/>
  <circle cx="400" cy="396" r="19" fill="#ff2bd6" stroke="#fff0fc" stroke-width="5"><animate attributeName="r" values="16;21;16" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="396" r="7" fill="#2b0925"/>
  <path d="M382 441H418M389 454H411" stroke="#d4fbff" stroke-width="5" stroke-linecap="round"/>
  <path d="M400 316V286" stroke="#ff65cf" stroke-width="4"/><circle cx="400" cy="279" r="7" fill="#ff65cf"><animate attributeName="r" values="5;10;5" dur="1s" repeatCount="indefinite"/></circle>
</g>
</g>
<g fill="#ffe5fb" opacity=".8"><circle cx="280" cy="280" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="520" cy="285" r="4"><animate attributeName="opacity" values="1;.2;1" dur="1.7s" repeatCount="indefinite"/></circle><circle cx="300" cy="520" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="500" cy="520" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/></circle></g>
</svg>