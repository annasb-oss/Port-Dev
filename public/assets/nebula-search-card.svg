<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
<title id="title">Nebula Search — aranha crawler neon magenta</title>
<desc id="desc">Aranha robótica de oito pernas articuladas em azul-ciano, rastreando quatro URLs conectadas em uma interface futurista.</desc>
<defs>
  <radialGradient id="background"><stop stop-color="#35102f"/><stop offset=".58" stop-color="#160817"/><stop offset="1" stop-color="#09040c"/></radialGradient>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2fa"/><stop offset=".28" stop-color="#e45bc4"/><stop offset=".7" stop-color="#7a1b60"/><stop offset="1" stop-color="#2c0b28"/></linearGradient>
  <linearGradient id="cyan"><stop stop-color="#ff2bd6"/><stop offset=".55" stop-color="#ff65cf"/><stop offset="1" stop-color="#ffb1ed"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9c286f" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="800" height="800" fill="url(#background)"/>
<rect width="800" height="800" fill="url(#grid)"/>
<circle cx="400" cy="390" r="210" fill="#ff2bd6" opacity=".13" filter="url(#softGlow)"/>
<g fill="none" stroke="#a72a7a" stroke-opacity=".3"><circle cx="400" cy="390" r="210"/><circle cx="400" cy="390" r="270" stroke-dasharray="5 13"/><circle cx="400" cy="390" r="330" stroke-dasharray="2 16"/></g>
<!-- Ten simultaneous URL targets -->
<g font-family="Arial,sans-serif" font-size="14" font-weight="700">
  <g><rect x="22" y="68" width="202" height="46" rx="11" fill="#210b28" stroke="#ff4bd8" stroke-width="2"/><text x="38" y="96" fill="#ffe5fb">https://alpha.dev</text><circle cx="34" cy="79" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="576" y="68" width="202" height="46" rx="11" fill="#210b28" stroke="#ff4bd8" stroke-width="2"/><text x="592" y="96" fill="#ffe5fb">https://orbit.io</text><circle cx="588" cy="79" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="22" y="205" width="202" height="46" rx="11" fill="#210b28" stroke="#f04bc9" stroke-width="2"/><text x="38" y="233" fill="#ffe5fb">https://nova.app</text><circle cx="34" cy="216" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="576" y="205" width="202" height="46" rx="11" fill="#210b28" stroke="#f04bc9" stroke-width="2"/><text x="592" y="233" fill="#ffe5fb">https://pulse.net</text><circle cx="588" cy="216" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="22" y="342" width="202" height="46" rx="11" fill="#210b28" stroke="#ff4bd8" stroke-width="2"/><text x="38" y="370" fill="#ffe5fb">https://lumen.dev</text><circle cx="34" cy="353" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="576" y="342" width="202" height="46" rx="11" fill="#210b28" stroke="#ff4bd8" stroke-width="2"/><text x="592" y="370" fill="#ffe5fb">https://flux.org</text><circle cx="588" cy="353" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="22" y="479" width="202" height="46" rx="11" fill="#210b28" stroke="#f04bc9" stroke-width="2"/><text x="38" y="507" fill="#ffe5fb">https://vertex.io</text><circle cx="34" cy="490" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="576" y="479" width="202" height="46" rx="11" fill="#210b28" stroke="#f04bc9" stroke-width="2"/><text x="592" y="507" fill="#ffe5fb">https://nexus.app</text><circle cx="588" cy="490" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="22" y="616" width="202" height="46" rx="11" fill="#210b28" stroke="#ff4bd8" stroke-width="2"/><text x="38" y="644" fill="#ffe5fb">https://nova.dev</text><circle cx="34" cy="627" r="3.5" fill="#ff8be8"/></g>
  <g><rect x="576" y="616" width="202" height="46" rx="11" fill="#210b28" stroke="#ff4bd8" stroke-width="2"/><text x="592" y="644" fill="#ffe5fb">https://echo.site</text><circle cx="588" cy="627" r="3.5" fill="#ff8be8"/></g>
</g>
<!-- Ten live crawler connections -->
<g fill="none" stroke-width="2.5" stroke-linecap="round" opacity=".9">
  <path d="M224 91 Q300 110 365 335" stroke="#ff4bd8" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;-68" dur="1.8s" repeatCount="indefinite"/></path>
