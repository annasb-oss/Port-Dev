name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original Google AI Studio components
        shell: bash
        run: |
          set -euo pipefail
          archive="public/assets/aistudio/ftrz---3d-card__7__46d05314.zip"
          test -f "$archive"
          restore_file() {
            local source="$1"
            local destination="$2"
            mkdir -p "$(dirname "$destination")"
            unzip -p "$archive" "$source" > "$destination"
            test -s "$destination"
          }
          restore_file "src/components/AuroraBackground.tsx" "src/components/AuroraBackground.tsx"
          restore_file "src/components/HeroStarfield.tsx" "src/components/HeroStarfield.tsx"
          restore_file "src/components/band/App.tsx" "src/components/band/App.tsx"
          restore_file "src/components/band/index.css" "src/components/band/index.css"
          restore_file "src/components/pacman/PacmanDivider.tsx" "src/components/pacman/PacmanDivider.tsx"
          restore_file "src/components/pacman/pacman-game.ts" "src/components/pacman/pacman-game.ts"
          restore_file "src/components/AboutPortraitMorph.tsx" "src/components/AboutPortraitMorph.tsx"
          restore_file "src/components/AboutNebulaReveal.tsx" "src/components/AboutNebulaReveal.tsx"
          restore_file "src/components/about-morph.ts" "src/components/about-morph.ts"
          restore_file "src/assets/images/teal_blue_nebula_1794604639109.jpg" "src/assets/images/teal_blue_nebula_1794604639109.jpg"
          restore_file "src/types.d.ts" "src/types.d.ts"
          restore_file "public/assets/kartu.glb" "public/assets/kartu.glb"
          restore_file "public/assets/bandd.png" "public/assets/bandd.png"
          restore_file "public/assets/card_texture_custom.png" "public/assets/card_texture_custom.png"
          # The original ZIP uses root-absolute asset paths. GitHub Pages serves this project below /Port-Dev/.
          # Prefix only these resource URLs with Vite's configured base path; visuals and component behavior stay unchanged.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/components/band/App.tsx")
          source = path.read_text()
          source = source.replace("const GLTF_PATH = '/assets/kartu.glb';", "const GLTF_PATH = `${import.meta.env.BASE_URL}assets/kartu.glb`;")
          source = source.replace("const TEXTURE_PATH = '/assets/bandd.png';", "const TEXTURE_PATH = `${import.meta.env.BASE_URL}assets/bandd.png`;")
          source = source.replace("const CARD_TEXTURE_PATH = '/assets/card_texture_custom.png?v=5';", "const CARD_TEXTURE_PATH = `${import.meta.env.BASE_URL}assets/card_texture_custom.png?v=5`;")
          # Slightly reduce the 3D card model so it remains inside its visible frame.
          source = source.replace("scale={2.85}", "scale={2.35}");
          # Narrow only the oversized black ribbon; preserve the lanyard cord, clip and card.
          source = source.replace("lineWidth={1}", "lineWidth={0.14}");
          path.write_text(source)

          # Restore the original portrait reveal, but resolve its assets under /Port-Dev/.
          portrait = Path("src/components/AboutPortraitMorph.tsx")
          source = portrait.read_text()
          source = source.replace("const ANA_CUTOUT_SRC = '/assets/ana-cutout.png';", "const ANA_CUTOUT_SRC = `${import.meta.env.BASE_URL}assets/ana-cutout.png`;")
          source = source.replace("const CATWOMAN_CUTOUT_SRC = '/assets/ana-catwoman.png';", "const CATWOMAN_CUTOUT_SRC = `${import.meta.env.BASE_URL}assets/ana-catwoman.png`;")
          portrait.write_text(source)

          # Keep vertical scrolling enabled in the restored 3D component.
          band_css = Path("src/components/band/index.css")
          source = band_css.read_text().replace("touch-action: none;", "touch-action: pan-y;")
          band_css.write_text(source)
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4