name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original Google AI Studio components
        shell: bash
        run: |
          set -euo pipefail
          archive="public/assets/aistudio/ftrz---3d-card__7__46d05314.zip"
          test -f "$archive"
          restore_file() {
            local source="$1"
            local destination="$2"
            mkdir -p "$(dirname "$destination")"
            unzip -p "$archive" "$source" > "$destination"
            test -s "$destination"
          }
          restore_file "src/components/AuroraBackground.tsx" "src/components/AuroraBackground.tsx"
          restore_file "src/components/HeroStarfield.tsx" "src/components/HeroStarfield.tsx"
          restore_file "src/components/band/App.tsx" "src/components/band/App.tsx"
          restore_file "src/components/band/index.css" "src/components/band/index.css"
          restore_file "src/components/pacman/PacmanDivider.tsx" "src/components/pacman/PacmanDivider.tsx"
          restore_file "src/components/pacman/pacman-game.ts" "src/components/pacman/pacman-game.ts"
          restore_file "src/types.d.ts" "src/types.d.ts"
          restore_file "public/assets/kartu.glb" "public/assets/kartu.glb"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4